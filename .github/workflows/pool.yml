name: forecast-pool

on:
  schedule:
    - cron: "*/15 * * * *"   # tick: every 15 min (private repo? change to */30 to stay in free minutes)
    - cron: "45 12 * * *"    # candidates: 18:15 IST
    - cron: "15 3 * * *"     # score: 08:45 IST
  workflow_dispatch:
    inputs:
      command:
        description: "What to run"
        type: choice
        default: tick
        options: [init, candidates, tick, score]

concurrency:
  group: forecast-pool
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pick command
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "cmd=${{ inputs.command }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "45 12 * * *" ]; then
            echo "cmd=candidates" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 3 * * *" ]; then
            echo "cmd=score" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=tick" >> "$GITHUB_OUTPUT"
          fi
      - name: Run
        run: python run.py "${{ steps.pick.outputs.cmd }}"
        env:
          POOL_SHEET_ID: ${{ secrets.POOL_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
